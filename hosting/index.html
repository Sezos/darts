<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DartScore</title>
<meta name="description" content="DartScore: darts scorekeeper for x01 and Cricket, with checkout hints, skill ranks and friends.">
<meta name="theme-color" content="#080F0C">
<style>
  :root { --bg: #080F0C; --surface: #0D1F17; --border: #1D3D2D; --mint: #00E896; --text: #ECFDF7; --muted: #7AA896; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px 16px;
    background: radial-gradient(circle at 50% 0%, #0f2c1f 0%, var(--bg) 60%);
    color: var(--text); font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  main { width: 100%; max-width: 420px; text-align: center; background: var(--surface); border: 1px solid var(--border); border-radius: 24px; padding: 32px 24px; }
  h1 { font-weight: 900; font-size: 32px; margin: 0 0 4px; }
  h1 span { color: var(--mint); }
  p { color: var(--muted); margin: 0 0 20px; }
  a { display: block; text-decoration: none; font-weight: 800; border-radius: 14px; padding: 14px; margin-top: 10px; border: 1px solid var(--border); color: var(--text); }
  a.primary { background: var(--mint); color: var(--bg); border-color: var(--mint); }
</style>
</head>
<body>
<main>
  <h1>Dart<span>Score</span></h1>
  <p>Darts scorekeeper for x01 and Cricket, with checkout hints, skill ranks and friends.</p>
  <a class="primary" href="https://apps.apple.com/app/id6757249203">App Store</a>
  <a href="https://play.google.com/store/apps/details?id=mn.badral.darts">Google Play</a>
</main>
</body>
</html>
